name: Streamlit Keep Alive

on:
  schedule:
    # 每 2 小时 ping 一次（Streamlit Cloud 实际休眠阈值远短于文档的 7 天，
    # 社区反馈 12 小时甚至几小时无访问就会休眠；GitHub cron 本身可能延迟数十分钟，
    # 2 小时间隔留有足够余量）
    - cron: '17 */2 * * *'
  workflow_dispatch: # 允许在 GitHub 控制台上手动触发

jobs:
  keep_alive:
    runs-on: ubuntu-latest
    steps:
      - name: Send HTTP request to wake up Streamlit app
        run: |
          # 必须 -L 跟随跳转 + cookie jar：首页对匿名访问先 303 到
          # share.streamlit.io/-/auth 建立会话再回跳，不跟随跳转的请求
          # 会被边缘代理拦下，永远到不了应用容器（旧版 curl -I 即败于此）。
          # 最终应输出 200 且带若干次 redirect 才算真正打到应用。
          curl -sSL -c /tmp/st_cookies -b /tmp/st_cookies \
            -o /dev/null \
            -w "home: %{http_code} (redirects: %{num_redirects})\n" \
            -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36" \
            https://data-dashboard-4aa8egslexarg4fuezw2pk.streamlit.app/
          curl -sS -w "\nhealthz: %{http_code}\n" \
            https://data-dashboard-4aa8egslexarg4fuezw2pk.streamlit.app/healthz
