name: Daily Data Pipeline Check

on:
  schedule:
    # 北京时间每天上午 9:00 对应 UTC 每天凌晨 1:00
    - cron: '0 1 * * *'
  # 允许在 GitHub Actions 页面手动触发，方便调试
  workflow_dispatch:

jobs:
  validate-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # my_data.db 已不入库：本任务只做管线冒烟校验（26630 解析 + 新闻抓取 + 入库全流程在临时 workspace 中跑通即可），
      # 云端 Streamlit 容器启动时会从 26630.xlsx 现场重建数据库，无需在此提交任何文件。
      - name: Run data pipeline smoke check
        run: |
          python upload_data.py
          python -c "
import sqlite3
conn = sqlite3.connect('my_data.db')
cur = conn.cursor()
cur.execute(\"SELECT COUNT(*) FROM dashboard_embedded_charts\")
n = cur.fetchone()[0]
assert n == 20, f'嵌入图表数量异常: {n} (期望 20)'
cur.execute('SELECT COUNT(cpi_yoy) FROM dashboard_cpi_compare')
assert cur.fetchone()[0] > 0, 'dashboard_cpi_compare.cpi_yoy 全为空'
conn.close()
print('Daily pipeline smoke check OK: 20 embedded charts, CPI data present.')
"
